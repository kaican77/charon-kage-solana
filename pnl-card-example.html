<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0b0e14; font-family:-apple-system, 'Segoe UI', Roboto, sans-serif; padding:24px; }
  .card {
    width:680px;
    background:linear-gradient(180deg,#141a26 0%,#10141d 100%);
    border:1px solid #232c3d;
    border-radius:16px;
    padding:24px 26px;
    color:#e8ecf3;
    box-shadow:0 8px 32px rgba(0,0,0,.5);
  }
  .row { display:flex; align-items:center; }
  .status-badge { width:14px; height:14px; border-radius:50%; display:inline-block; margin-right:8px; }
  .status-open { background:#3b82f6; box-shadow:0 0 8px #3b82f6; }
  .status-closed { background:#f59e0b; }
  .mode { display:inline-block; padding:2px 10px; border-radius:20px; font-size:12px; font-weight:600; }
  .mode-dry { background:#065f46; color:#6ee7b7; }
  .mode-live { background:#7f1d1d; color:#fca5a5; }
  .strategy { display:inline-block; padding:2px 10px; border-radius:20px; font-size:12px; font-weight:600; background:#1e3a5f; color:#93c5fd; }
  .divider { height:1px; background:linear-gradient(90deg,#2a3345,transparent); margin:14px 0; }
  .divider-light { height:1px; background:linear-gradient(90deg,#1c2333,transparent); margin:10px 0; }
  .mint { font-family:'SF Mono', Consolas, monospace; font-size:13px; color:#8b93a7; }
  .field { display:flex; justify-content:space-between; align-items:center; padding:3px 0; font-size:14px; }
  .field .label { color:#9aa3b8; }
  .field .val { color:#f1f4fa; font-weight:600; }
  .tx { font-family:'SF Mono', Consolas, monospace; font-size:11.5px; color:#5b6b8c; margin-top:4px; }
  .pnl { font-size:15px; font-weight:700; }
  .pnl-green { color:#22c55e; }
  .pnl-red { color:#ef4444; }
  .pnl-flat { color:#94a3b8; }
  .sub { font-size:12.5px; color:#8b93a7; }
  .badge { display:inline-block; padding:2px 10px; border-radius:20px; font-size:12px; font-weight:600; }
  .badge-tp { background:#1e293b; color:#fbbf24; }
  .badge-sl { background:#1e293b; color:#f87171; }
  .badge-trail { background:#1e293b; color:#38bdf8; }
  .header { display:flex; align-items:center; gap:10px; }
  .title { font-size:19px; font-weight:800; color:#fff; }
  .id { font-size:13px; color:#5b6b8c; font-weight:600; }
  .meta { margin-top:10px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .spark { margin:8px 0 2px; }
</style>
</head>
<body>
<div class="card">
  <!-- Header -->
  <div class="header">
    <span class="status-badge status-open"></span>
    <span class="title">FIRETAKE</span>
    <span class="id">#42</span>
  </div>
  <div class="divider-light"></div>

  <!-- Meta row -->
  <div class="mint">F1R3T4…90ab · gmgn.ai/sol/token/F1R3T4K3</div>
  <div class="meta">
    <span class="mode mode-dry">🟢 dry_run</span>
    <span class="strategy">⚡ akashi_zone</span>
    <span class="badge badge-tp">📊 open</span>
  </div>
  <div class="tx">➡️ Entry TX: 4xRtYz…QwEr (Solscan)</div>

  <div class="divider"></div>

  <!-- Mcap fields -->
  <div class="field"><span class="label">💰 Entry mcap</span><span class="val">$125.0K</span></div>
  <div class="field"><span class="label">⬆️ ATH mcap</span><span class="val">$198.0K</span></div>
  <div class="field"><span class="label">💵 Current mcap</span><span class="val">$187.0K</span></div>

  <!-- Sparkline -->
  <svg class="spark" width="628" height="56" viewBox="0 0 628 56" fill="none">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#22c55e" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="M0,44 L70,40 L140,33 L210,36 L280,22 L350,12 L420,7 L490,3 L560,5 L628,4 L628,56 L0,56 Z" fill="url(#g)"/>
    <polyline points="0,44 70,40 140,33 210,36 280,22 350,12 420,7 490,3 560,5 628,4" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <div class="divider"></div>

  <!-- PnL row -->
  <div class="field">
    <span class="label">💸 Size: <b style="color:#f1f4fa">0.5000 SOL</b></span>
    <span class="pnl pnl-green">🟢 PnL: +49.6%</span>
  </div>
  <div class="field" style="margin-top:8px">
    <span class="badge badge-tp">🎯 TP: 100.0%</span>
    <span class="badge badge-sl">🚨 SL: -50.0%</span>
    <span class="badge badge-trail">📉 Trail: 16.0%</span>
  </div>
</div>
</body>
</html>
